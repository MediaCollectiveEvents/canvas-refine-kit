    <!-- ✅ Netlify Identity / Decap invite + recovery redirect -->
    <script>
      (function () {
        try {
          var h = window.location.hash || "";

          // Matches:
          // #invite_token=...
          // #/invite_token=...
          // #recovery_token=...
          // #/recovery_token=...
          // plus confirmation + email change tokens
          var isIdentityLink =
            h.startsWith("#invite_token=") ||
            h.startsWith("#/invite_token=") ||
            h.startsWith("#recovery_token=") ||
            h.startsWith("#/recovery_token=") ||
            h.startsWith("#confirmation_token=") ||
            h.startsWith("#/confirmation_token=") ||
            h.startsWith("#email_change_token=") ||
            h.startsWith("#/email_change_token=");

          if (
            isIdentityLink &&
            !window.location.pathname.startsWith("/admin")
          ) {
            window.location.replace("/admin/" + h);
          }
        } catch (e) {}
      })();
    </script>
