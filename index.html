<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ✅ Netlify Identity / Decap invite + recovery redirect (must be in <head>) -->
    <script>
      (function () {
        var h = window.location.hash || "";
        // If someone opens an Identity link on the site root, forward it to /admin
        if (
          h.startsWith("#invite_token=") ||
          h.startsWith("#recovery_token=") ||
          h.startsWith("#confirmation_token=") ||
          h.startsWith("#email_change_token=")
        ) {
          window.location.replace("/admin/" + h);
        }
      })();
    </script>

    <link
      rel="preload"
      href="/fonts/PlaylistScript.otf"
      as="font"
      type="font/otf"
      crossorigin
    />

    <title>Media Collective Events</title>
