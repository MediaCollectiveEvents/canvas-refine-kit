<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>

    <!-- Netlify Identity widget (REQUIRED for invite/recovery tokens) -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>

  <body>
    <!-- Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // If we arrived with an invite/recovery token, force the Identity widget to open
      // so the token flow is processed instead of showing the default Decap login.
      (function () {
        var hash = window.location.hash || "";

        function openFlow() {
          if (!window.netlifyIdentity) return;

          if (hash.indexOf("recovery_token=") !== -1) {
            window.netlifyIdentity.open("recover");
          } else if (hash.indexOf("invite_token=") !== -1) {
            window.netlifyIdentity.open("signup");
          } else if (hash.indexOf("confirmation_token=") !== -1) {
            window.netlifyIdentity.open("login");
          } else if (hash.indexOf("email_change_token=") !== -1) {
            window.netlifyIdentity.open("login");
          }
        }

        // Wait for widget init then open the correct flow
        if (window.netlifyIdentity) {
          window.netlifyIdentity.on("init", openFlow);
          window.netlifyIdentity.init();
          // Fallback in case init already happened
          setTimeout(openFlow, 300);
        }
      })();
    </script>
  </body>
</html>
