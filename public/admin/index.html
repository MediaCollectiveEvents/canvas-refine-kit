<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png?v=mc-supplied-20261023" />

  <body>
    <!-- Decap CMS will mount its UI here -->
    <a id="staging-media-library" href="/media-library/" hidden style="position:fixed;right:1rem;bottom:1rem;z-index:1000;border-radius:.4rem;padding:.6rem .9rem;background:#102630;color:#fff;font:600 14px system-ui">Media Library</a>
    <script>if (location.hostname === 'staging.mediacollective.events') document.getElementById('staging-media-library').hidden = false;</script>
    <div id="nc-root"></div>

    <!-- Register the root-array FAQ adapter before Decap reads any content. -->
    <script>window.CMS_MANUAL_INIT = true;</script>

    <!-- 1) Decap CMS core (this one is CONFIRMED 200 OK on your machine) -->
    <script src="/admin/vendor/decap-cms.js"></script>

    <!-- 2) Your preview bundle built by Vite (must load AFTER Decap CMS) -->
    <script src="/admin/cms.bundle.js"></script>

  </body>
