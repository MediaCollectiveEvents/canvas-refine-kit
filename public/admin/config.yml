backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit # <--- change if repo name is different
  branch: main

local_backend: true

media_folder: "public/uploads" # where uploaded files are stored in the repo
public_folder: "/uploads" # how those files are referenced in the site

collections:
  # HOMEPAGE CONTENT
  - name: "homepage"
    label: "Homepage"
    file: "src/content/homepage.json"
    format: "json"
    fields:
      - { name: "heroTitle", label: "Hero Title", widget: "string" }
      - { name: "heroSubtitle", label: "Hero Subtitle", widget: "text" }
      - {
          name: "heroButtonLabel",
          label: "Hero Button Label",
          widget: "string",
          required: false,
        }
      - {
          name: "heroButtonUrl",
          label: "Hero Button URL",
          widget: "string",
          required: false,
        }
      - name: "sections"
        label: "Homepage Sections"
        widget: "list"
        fields:
          - { name: "id", label: "Section ID", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - {
              name: "accent",
              label: "Accent Word",
              widget: "string",
              required: false,
            }
          - { name: "body", label: "Body", widget: "markdown", required: false }
          - {
              name: "enabled",
              label: "Enabled",
              widget: "boolean",
              default: true,
            }

  # ABOUT SECTION / PAGE
  - name: "about"
    label: "About"
    file: "src/content/about.json"
    format: "json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "accent",
          label: "Accent Word",
          widget: "string",
          required: false,
        }
      - { name: "intro", label: "Intro Text", widget: "markdown" }
      - {
          name: "body",
          label: "Body Text",
          widget: "markdown",
          required: false,
        }

  # FAQ
  - name: "faq"
    label: "FAQs"
    file: "src/content/faq.json"
    format: "json"
    fields:
      - name: "items"
        label: "FAQ Items"
        widget: "list"
        fields:
          - { name: "question", label: "Question", widget: "string" }
          - { name: "answer", label: "Answer", widget: "markdown" }

  # GLOBAL SITE SETTINGS (palette, nav, footer)
  - name: "settings"
    label: "Site Settings"
    file: "src/content/settings.json"
    format: "json"
    fields:
      - name: "palette"
        label: "Colour Palette"
        widget: "object"
        fields:
          - {
              name: "primary",
              label: "Primary Colour",
              widget: "string",
              default: "#36e0c6",
            }
          - {
              name: "secondary",
              label: "Secondary Colour",
              widget: "string",
              required: false,
            }
          - {
              name: "background",
              label: "Background Colour",
              widget: "string",
              required: false,
            }
      - name: "footer"
        label: "Footer"
        widget: "object"
        fields:
          - {
              name: "text",
              label: "Footer Text",
              widget: "string",
              required: false,
            }
          - {
              name: "showEventsInFooter",
              label: "Show Events in Footer",
              widget: "boolean",
              default: false,
            }
      - name: "nav"
        label: "Navigation"
        widget: "list"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "href", label: "URL", widget: "string" }

  # SPONSORS DIRECTORY
  - name: "sponsors"
    label: "Sponsors"
    file: "src/content/sponsors.json"
    format: "json"
    fields:
      - name: "items"
        label: "Sponsors"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "url",
              label: "Website URL",
              widget: "string",
              required: false,
            }
          - { name: "tier", label: "Tier", widget: "string", required: false }
          - { name: "logo", label: "Logo", widget: "image", required: false }
          - {
              name: "summary",
              label: "Summary",
              widget: "text",
              required: false,
            }

  # SPEAKERS DIRECTORY
  - name: "speakers"
    label: "Speakers"
    file: "src/content/speakers.json"
    format: "json"
    fields:
      - name: "items"
        label: "Speakers"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "role",
              label: "Role / Title",
              widget: "string",
              required: false,
            }
          - {
              name: "company",
              label: "Company",
              widget: "string",
              required: false,
            }
          - {
              name: "url",
              label: "Profile URL",
              widget: "string",
              required: false,
            }
          - { name: "photo", label: "Photo", widget: "image", required: false }
          - { name: "bio", label: "Bio", widget: "markdown", required: false }

  # PARTNERS
  - name: "partners"
    label: "Partners"
    file: "src/content/partners.json"
    format: "json"
    fields:
      - name: "items"
        label: "Partners"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "url",
              label: "Website URL",
              widget: "string",
              required: false,
            }
          - { name: "logo", label: "Logo", widget: "image", required: false }
          - {
              name: "description",
              label: "Description",
              widget: "markdown",
              required: false,
            }

  # BLOG POSTS (MARKDOWN)
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "date", label: "Date", widget: "datetime" }
      - {
          name: "category",
          label: "Category",
          widget: "string",
          required: false,
        }
      - { name: "excerpt", label: "Excerpt", widget: "text", required: false }
      - { name: "image", label: "Hero Image", widget: "image", required: false }
      - { name: "tags", label: "Tags", widget: "list", required: false }
      - { name: "body", label: "Body", widget: "markdown" }

  # EVENTS (MARKDOWN) – internal + third‑party
  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - { name: "slug", label: "Slug", widget: "string" }
      - { name: "date", label: "Event Date", widget: "datetime" }
      - {
          name: "location",
          label: "Location",
          widget: "string",
          required: false,
        }
      - name: "type"
        label: "Event Type"
        widget: "select"
        options: ["internal", "third-party"]
        default: "internal"
      - {
          name: "externalUrl",
          label: "External URL (for third-party)",
          widget: "string",
          required: false,
        }
      - name: "keywords"
        label: "Keywords"
        widget: "select"
        multiple: true
        options:
          - "networking"
          - "innovation"
          - "media"
          - "creators"
          - "ai"
          - "production"
          - "sponsorship"
      - {
          name: "summary",
          label: "Short Summary",
          widget: "text",
          required: false,
        }
      - { name: "body", label: "Details", widget: "markdown", required: false }
