local_backend: true

backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit
  branch: minviableproduct

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: "src/content/homepage.json"
        format: json
        fields:
          - label: Hero Section
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Description, name: description, widget: text }
              - label: Primary CTA
                name: primaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Secondary CTA
                name: secondaryCta
                widget: object
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }

          - label: Sections
            name: sections
            widget: list
            types:
              - label: About Intro
                name: aboutIntro
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "aboutIntro",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - { label: Extended Text, name: extended, widget: text }

              - label: Who Attends
                name: whoAttends
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "whoAttends",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - label: Audience Groups
                    name: audienceGroups
                    widget: list
                    field: { label: Item, name: item, widget: string }
                  - label: Statistics
                    name: statistics
                    widget: object
                    fields:
                      - { label: Companies, name: companies, widget: string }
                      - { label: Board Level, name: boardLevel, widget: string }
                      - { label: Founders, name: founders, widget: string }
                  - label: Highlights
                    name: highlights
                    widget: list
                    field: { label: Highlight, name: item, widget: string }

              - label: Upcoming Events Intro
                name: upcomingEventsIntro
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "upcomingEventsIntro",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Description, name: description, widget: text }
                  - { label: Note, name: note, widget: string }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }
                  - label: Secondary CTA
                    name: secondaryCta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: Testimonials
                name: testimonials
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "testimonials",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - label: Items
                    name: items
                    widget: list
                    field: { label: Testimonial Item, name: item, widget: text }

              - label: Partners Section
                name: partners
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "partners",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Description, name: description, widget: text }
                  - label: Logos
                    name: logos
                    widget: list
                    field: { label: Logo URL, name: logo, widget: string }

              - label: Join Community
                name: joinCommunity
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "joinCommunity",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: New Here
                name: newHere
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "newHere",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: For Brands & Partners
                name: forBrands
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "forBrands",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

          - { label: Internal Title (Ignore), name: title, widget: string }
