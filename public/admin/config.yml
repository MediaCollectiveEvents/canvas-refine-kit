backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit
  branch: minviableproduct

  # Netlify OAuth for Decap (required)
  base_url: https://api.netlify.com
  auth_endpoint: auth
  site_domain: themediecollective.netlify.app

  # optional but recommended
  auth_scope: repo
  allowed_users:
    - MediaCollectiveEvents

collections:
  # ----------------------------------------------------------------------
  # HOMEPAGE (single JSON file via `files`)
  # ----------------------------------------------------------------------
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: "src/content/homepage.json"
        format: json
        fields:
          - name: hero
            label: Hero
            widget: object
            fields:
              - name: title
                widget: string
              - name: subtitle
                widget: string
              - name: description
                widget: text
              - name: primaryCta
                widget: object
                fields:
                  - name: label
                    widget: string
                  - name: url
                    widget: string
              - name: secondaryCta
                widget: object
                required: false
                fields:
                  - name: label
                    widget: string
                  - name: url
                    widget: string

          - name: sections
            label: Homepage Sections
            widget: list
            types:
              # ------------------------------------------------------------
              # TEMPORARY FIX — rescue types for phantom blocks
              # ------------------------------------------------------------
              - name: homeIntro
                label: "DEPRECATED: Old Home Intro"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "homeIntro"
                  - name: heading
                    widget: string
                    required: false
                  - name: body
                    widget: text
                    required: false

              - name: eventFormats
                label: "DEPRECATED: Old Event Formats"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "eventFormats"
                  - name: heading
                    widget: string
                    required: false
                  - name: body
                    widget: text
                    required: false

              # ------------------------------------------------------------
              # REAL SECTION TYPES
              # ------------------------------------------------------------
              - name: aboutIntro
                label: "About Intro (Main Overview)"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "aboutIntro"
                  - name: heading
                    widget: string
                  - name: body
                    widget: text
                  - name: extended
                    widget: text
                    required: false

              - name: whoAttends
                label: "Audience Overview"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "whoAttends"
                  - name: audienceGroups
                    widget: list
                    field:
                      name: item
                      widget: string
                  - name: statistics
                    widget: object
                    fields:
                      - name: companies
                        widget: string
                        required: false
                      - name: boardLevel
                        widget: string
                        required: false
                      - name: founders
                        widget: string
                        required: false
                  - name: highlights
                    widget: list
                    field:
                      name: item
                      widget: string

              - name: upcomingEventsIntro
                label: "Upcoming Events Intro (CTA)"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "upcomingEventsIntro"
                  - name: heading
                    widget: string
                  - name: description
                    widget: text
                  - name: note
                    widget: string
                    required: false
                  - name: cta
                    widget: object
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string
                  - name: secondaryCta
                    widget: object
                    required: false
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string

              - name: testimonials
                label: "Member Testimonials"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "testimonials"
                  - name: heading
                    widget: string
                  - name: items
                    widget: list
                    fields:
                      - name: quote
                        widget: text
                      - name: name
                        widget: string
                        required: false
                      - name: role
                        widget: string
                        required: false
                      - name: company
                        widget: string
                        required: false

              - name: partners
                label: "Featured Partners"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "partners"
                  - name: heading
                    widget: string
                  - name: description
                    widget: text
                  - name: logos
                    widget: list
                    fields:
                      - name: name
                        widget: string
                      - name: logoUrl
                        widget: string
                      - name: websiteUrl
                        widget: string
                        required: false

              - name: joinCommunity
                label: "Join the Community (CTA)"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "joinCommunity"
                  - name: heading
                    widget: string
                  - name: body
                    widget: text
                  - name: cta
                    widget: object
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string

              - name: newHere
                label: "New Here (Welcome Message)"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "newHere"
                  - name: heading
                    widget: string
                  - name: body
                    widget: text
                  - name: cta
                    widget: object
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string

              - name: forBrands
                label: "For Brands & Partnerships"
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "forBrands"
                  - name: heading
                    widget: string
                  - name: body
                    widget: text
                  - name: cta
                    widget: object
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string

  # ----------------------------------------------------------------------
  # ABOUT PAGE
  # ----------------------------------------------------------------------
  - name: about
    label: About Page
    files:
      - name: about
        label: About Content
        file: src/content/about.json
        format: json
        fields:
          - name: hero
            widget: object
            fields:
              - name: eyebrow
                widget: string
              - name: title
                widget: string
              - name: description
                widget: text
              - name: primaryCta
                widget: object
                fields:
                  - name: label
                    widget: string

          - name: sections
            widget: list
            types:
              - name: aboutIntro
                label: About Intro
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "aboutIntro"
                  - name: title
                    widget: string
                  - name: accentWord
                    widget: string
                  - name: body
                    widget: text
                  - name: cta
                    widget: object
                    required: false
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string
                        required: false

              - name: story
                label: Our Story
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "story"
                  - name: title
                    widget: string
                  - name: accentWord
                    widget: string
                  - name: body
                    widget: text

              - name: missionValues
                label: Mission & Values
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "missionValues"
                  - name: title
                    widget: string
                  - name: accentWord
                    widget: string
                  - name: description
                    widget: text
                  - name: values
                    widget: list
                    fields:
                      - name: icon
                        widget: select
                        options:
                          - users
                          - heart
                          - star
                      - name: title
                        widget: string
                      - name: description
                        widget: text
                      - name: color
                        widget: string
                      - name: bgColor
                        widget: string

              - name: joinUs
                label: Join Us
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: "joinUs"
                  - name: title
                    widget: string
                  - name: accentWord
                    widget: string
                  - name: body
                    widget: text
                  - name: cta
                    widget: object
                    fields:
                      - name: label
                        widget: string
                      - name: url
                        widget: string
                        required: false

  # ----------------------------------------------------------------------
  # FAQ
  # ----------------------------------------------------------------------
  - name: faq
    label: FAQ
    files:
      - name: faq
        label: FAQ Content
        file: src/content/faq.json
        format: json
        fields:
          - name: items
            widget: list
            fields:
              - name: question
                widget: string
              - name: answer
                widget: markdown

  # ----------------------------------------------------------------------
  # SETTINGS
  # ----------------------------------------------------------------------
  - name: settings
    label: Settings
    files:
      - name: settings
        label: Site Settings
        file: src/content/settings.json
        format: json
        fields:
          - name: palette
            widget: object
            fields:
              - name: primary
                widget: string
              - name: secondary
                widget: string
                required: false
              - name: background
                widget: string
                required: false

          - name: footer
            widget: object
            fields:
              - name: text
                widget: string
                required: false
              - name: showEventsInFooter
                widget: boolean

          - name: nav
            widget: list
            fields:
              - name: label
                widget: string
              - name: href
                widget: string

  # ----------------------------------------------------------------------
  # SPONSORS
  # ----------------------------------------------------------------------
  - name: sponsors
    label: Sponsors
    files:
      - name: sponsors
        label: Sponsors Content
        file: src/content/sponsors.json
        format: json
        fields:
          - name: items
            widget: list
            fields:
              - name: name
                widget: string
              - name: url
                widget: string
                required: false
              - name: tier
                widget: string
                required: false
              - name: logo
                widget: image
                required: false
              - name: summary
                widget: text
                required: false

  # ----------------------------------------------------------------------
  # SPEAKERS
  # ----------------------------------------------------------------------
  - name: speakers
    label: Speakers
    files:
      - name: speakers
        label: Speakers Content
        file: src/content/speakers.json
        format: json
        fields:
          - name: items
            widget: list
            fields:
              - name: name
                widget: string
              - name: role
                widget: string
                required: false
              - name: company
                widget: string
                required: false

  # ----------------------------------------------------------------------
  # PARTNERS
  # ----------------------------------------------------------------------
  - name: partners
    label: Partners
    files:
      - name: partners
        label: Partners Content
        file: src/content/partners.json
        format: json
        fields:
          - name: items
            widget: list
            fields:
              - name: name
                widget: string
              - name: url
                widget: string
                required: false
              - name: logo
                widget: image
                required: false
              - name: description
                widget: markdown
                required: false

  # ----------------------------------------------------------------------
  # BLOG POSTS (folder)
  # ----------------------------------------------------------------------
  - name: blog
    label: Blog Posts
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - name: title
        widget: string
      - name: date
        widget: datetime
      - name: author
        widget: string
      - name: excerpt
        widget: text
        required: false
      - name: image
        widget: image
        required: false
      - name: tags
        widget: list
        required: false
      - name: body
        widget: markdown

  # ----------------------------------------------------------------------
  # EVENTS (folder)
  # ----------------------------------------------------------------------
  - name: events
    label: Events
    folder: src/content/events
    create: true
    slug: "{{slug}}"
    format: json
    fields:
      - name: title
        widget: string
      - name: date
        widget: datetime
      - name: location
        widget: string
        required: false
      - name: summary
        widget: text
        required: false
      - name: externalUrl
        widget: string
        required: false
