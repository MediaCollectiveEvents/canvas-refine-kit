local_backend: true

backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit
  branch: staging
  site_domain: themediacollective.netlify.app

media_folder: "public/uploads"
public_folder: "/uploads"

editor:
  preview: true

hero_fields: &hero_fields
  - label: Current Hero Eyebrow / Fallback
    name: subtitle
    widget: string
    required: false
    hint: "Current homepage eyebrow. If hero.eyebrow is present, it takes precedence over this fallback."
  - { label: Eyebrow, name: eyebrow, widget: string, required: false }
  - { label: Title, name: title, widget: string }
  - { label: Description, name: description, widget: text, required: false }

  - label: Hero Image
    name: image
    widget: image
    required: false

collections:
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: "src/content/homepage.json"
        format: json
        fields:
          - label: SEO
            name: seo
            widget: object
            fields:
              - { label: Browser / SEO Title, name: title, widget: string }
              - { label: SEO Description, name: description, widget: text }
              - { label: Social Sharing Image, name: ogImage, widget: image }
          - label: Hero
            name: hero
            widget: object
            fields: *hero_fields

          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} – {{fields.heading}}"
            types:
              - label: Our Events
                name: ourEvents
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: ourEvents }
                  - { label: ID, name: id, widget: string, required: false }
                  - { label: Section Label, name: eyebrow, widget: string }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Copy, name: body, widget: text }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - label: Events
                    name: items
                    widget: list
                    summary: "{{fields.title}}"
                    fields:
                      - label: Event
                        name: eventId
                        widget: relation
                        collection: events
                        file: eventsContent
                        search_fields: ["events.*.title", "events.*.id"]
                        display_fields: ["events.*.title"]
                        value_field: "events.*.id"
                      - { label: Display Name, name: title, widget: string, required: false }
              - label: Community Authority Strip
                name: authorityStrip
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: authorityStrip }
                  - { label: ID, name: id, widget: string, required: false }
                  - label: Statistics
                    name: metrics
                    widget: list
                    fields:
                      - { label: Value, name: value, widget: string }
                      - { label: Label, name: label, widget: string }
                  - { label: Sectors, name: sectors, widget: list }
                  - { label: Locations, name: locations, widget: list }
              - label: Organisations Represented
                name: organisationsRepresented
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: organisationsRepresented }
                  - { label: ID, name: id, widget: string, required: false }
                  - { label: Section Label, name: eyebrow, widget: string, required: false }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Copy, name: body, widget: text }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
              - label: Events for you
                name: eventDiscovery
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "eventDiscovery" }
                  - { label: Intro, name: intro, widget: text }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
              - label: Get involved
                name: getInvolved
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "getInvolved" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Intro, name: intro, widget: text }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - label: Ways to participate
                    name: items
                    widget: list
                    min: 3
                    max: 4
                    summary: "{{fields.heading}}"
                    fields:
                      - { label: Heading, name: heading, widget: string }
                      - { label: Body, name: body, widget: text }
                      - label: CTA
                        name: cta
                        widget: object
                        fields:
                          - { label: Label, name: label, widget: string }
                          - { label: URL, name: url, widget: string }

              - label: Join Community
                name: joinCommunity
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "joinCommunity" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string, required: false }
                      - { label: URL, name: url, widget: string, required: false }
              - label: About Intro
                name: aboutIntro
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "aboutIntro" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - { label: Body, name: body, widget: text }
              - label: Who Attends
                name: whoAttends
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "whoAttends" }
                  - { label: Heading, name: heading, widget: string }
                  - label: Supporting Copy
                    name: styleTitle
                    widget: object
                    required: false
                    fields:
                      - { label: Supporting Paragraph, name: sub, widget: text, required: false }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - label: Highlights
                    name: highlights
                    widget: list
                    allow_add: true
                    required: false
                    fields:
                      - { label: Title, name: title, widget: string, required: false }
                      - { label: Subtitle, name: subtitle, widget: string, required: false }
              - label: Upcoming Events Intro
                name: upcomingEventsIntro
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "upcomingEventsIntro" }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
              - label: For Brands & Partners
                name: forBrands
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "forBrands" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string, required: false }
                      - { label: URL, name: url, widget: string, required: false }
              - label: New Here
                name: newHere
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "newHere" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string, required: false }
                      - { label: URL, name: url, widget: string, required: false }
              - label: Testimonials
                name: testimonials
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "testimonials" }
                  - { label: Heading, name: heading, widget: string, required: false }
                  - label: Supporting Copy
                    name: styleTitle
                    widget: object
                    required: false
                    fields:
                      - { label: Eyebrow, name: eyebrow, widget: string, required: false }
                      - { label: Supporting Paragraph, name: sub, widget: text, required: false }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - label: Items
                    name: items
                    widget: list
                    required: false
                    fields:
                      - { label: Quote, name: quote, widget: text, required: false }
                      - { label: Name, name: name, widget: string, required: false }
                      - { label: Role, name: role, widget: string, required: false }
                      - { label: Company, name: company, widget: string, required: false }
              - label: Partners Strip
                name: partners
                widget: object
                fields:
                  - { label: Type, name: type, widget: hidden, default: "partners" }
                  - { label: Heading, name: heading, widget: string }
                  - { label: Hidden, name: hidden, widget: boolean, required: false, default: false }
                  - { label: Description, name: description, widget: text, required: false }
                  - label: Logos
                    name: logos
                    widget: list
                    required: false
                    field:
                      label: Logo Name
                      name: logo
                      widget: string
  - name: aboutPage
    label: About Page
    files:
      - name: about
        label: About Page Content
        file: "src/content/about.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - label: Hero Image
                name: image
                widget: image
                required: false
              - label: Theme
                name: theme
                widget: select
                options:
                  - { label: Dark, value: dark }
                  - { label: Light, value: light }
              - label: Overlay Strength
                name: overlayStrength
                widget: number
                value_type: float
                min: 0
                max: 1
                step: 0.05
                default: 0.5
              - label: Mobile Background Crop
                name: mobileCrop
                widget: select
                default: cover
                options:
                  - { label: Cover, value: cover }
                  - { label: Contain, value: contain }
              - label: Image Position
                name: imagePosition
                widget: select
                default: center
                options:
                  - { label: Top, value: top }
                  - { label: Center, value: center }
                  - { label: Bottom, value: bottom }
              - label: Image Vertical Offset (px)
                name: imageOffset
                widget: number
                default: 0
              - label: CTA
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }

          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} – {{fields.title}}"
            types:
              - label: About Intro
                name: aboutIntro
                widget: object
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Type, name: type, widget: hidden, default: "aboutIntro" }
                  - { label: Hidden, name: hidden, widget: boolean, default: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Accent Word, name: accentWord, widget: string, required: false }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string, required: false }

              - label: Story Section
                name: story
                widget: object
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Type, name: type, widget: hidden, default: "story" }
                  - { label: Hidden, name: hidden, widget: boolean, default: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Accent Word, name: accentWord, widget: string, required: false }
                  - { label: Body, name: body, widget: text }

              - label: Mission & Values
                name: missionValues
                widget: object
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Type, name: type, widget: hidden, default: "missionValues" }
                  - { label: Hidden, name: hidden, widget: boolean, default: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Accent Word, name: accentWord, widget: string }
                  - { label: Description, name: description, widget: text }
                  - label: Values
                    name: values
                    widget: list
                    fields:
                      - { label: Icon, name: icon, widget: string }
                      - { label: Title, name: title, widget: string }
                      - { label: Description, name: description, widget: text }
                      - { label: Color Class, name: color, widget: string, required: false }
                      - { label: BG Class, name: bgColor, widget: string, required: false }

              - label: Join Us
                name: joinUs
                widget: object
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Type, name: type, widget: hidden, default: "joinUs" }
                  - { label: Hidden, name: hidden, widget: boolean, default: false }
                  - { label: Title, name: title, widget: string }
                  - { label: Accent Word, name: accentWord, widget: string, required: false }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string, required: false }

  - name: faqPage
    label: FAQ Page
    files:
      - name: faqPage
        label: FAQ Page Content
        file: "src/content/faqPage.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - label: Hero Image
                name: image
                widget: image
                required: false
              - label: Variant
                name: variant
                widget: select
                required: false
                options:
                  - { label: Solid, value: solid }
                  - { label: Image, value: image }
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} – {{fields.title}}"
            types:
              - label: FAQ Section
                name: faqSection
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: faqSection
                  - label: ID
                    name: id
                    widget: string
                    required: false
                  - label: Hidden
                    name: hidden
                    widget: boolean
                    required: false
                    default: false
                  - label: Title
                    name: title
                    widget: string
                    required: false
                  - label: Description
                    name: description
                    widget: text
                    required: false
              - label: Call to Action
                name: cta
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: cta
                  - label: ID
                    name: id
                    widget: string
                    required: false
                  - label: Hidden
                    name: hidden
                    widget: boolean
                    required: false
                    default: false
                  - label: Title
                    name: title
                    widget: string
                    required: false
                  - label: Accent Word
                    name: accentWord
                    widget: string
                    required: false
                  - label: Description
                    name: description
                    widget: text
                    required: false
                  - label: Button Label
                    name: buttonLabel
                    widget: string
                    required: false

      - name: faqAnswers
        label: FAQ questions and answers
        file: src/content/faq.json
        format: json
        fields:
          - label: Questions and answers
            name: faqs
            widget: list
            summary: '{{fields.question}}'
            fields:
              - label: Question
                name: question
                widget: string
              - label: Answer
                name: answer
                widget: text

  - name: events
    label: Events Content & List
    files:
      - name: eventsContent
        label: Events Content
        file: "src/content/events.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Eyebrow, name: eyebrow, widget: string, required: false }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text, required: false }
              - label: Hero Image
                name: image
                widget: image
                required: false
          - label: Intro Section
            name: intro
            widget: object
            required: false
            fields:
              - { label: Title, name: title, widget: string, required: false }
              - { label: Body, name: body, widget: text, required: false }

          - label: Events
            name: events
            widget: list
            allow_add: true
            fields:
              - label: Stable Event ID
                name: id
                widget: stable-event-id
                value_type: int
                min: 1
                hint: "Existing IDs are locked. New events need an unused positive integer; existing event IDs must not be removed."
              - label: Status
                name: type
                widget: select
                required: false
                options: [upcoming, past]
              - label: Purpose / Format Tags
                name: formatTags
                widget: select
                multiple: true
                required: false
                options: [networking, social, industry-forum, discussion, breakfast, lunch, dinner, reception, drinks, journey]
                hint: "Include networking for every Media Collective event. Add only confirmed formats; do not use these as subject topics."
              - label: Conference Alignment
                name: conferenceAlignment
                widget: select
                multiple: true
                required: false
                options: [IBC, MPTS, NAB, LSE]
                hint: "Select only conferences/shows genuinely associated with this event."
              - label: Event Themes / Topics
                name: themeTags
                widget: select
                multiple: true
                required: false
                options: [AI, Monetisation, UX, Streaming, Broadcast, Live sports, Platforms, Distribution, Infrastructure, Production, Advertising, Content, Data, Cloud, Sustainability]
                hint: "Use only themes explicitly addressed by the agenda or description. Audience sectors alone are not programme topics."
              - label: Experience Categories
                name: experienceCategories
                widget: select
                multiple: true
                required: false
                options:
                  - { label: Networking & social gatherings, value: networking-social }
                  - { label: Conference-aligned gatherings, value: conference-aligned }
                  - { label: Knowledge & discussion forums, value: knowledge-discussion }
                hint: "Assign only confirmed categories. Status is controlled separately."
              - label: Areas
                name: areas
                widget: relation
                required: false
                collection: taxonomy
                file: taxonomy
                search_fields: ["areas.*.label", "areas.*.id"]
                display_fields: ["areas.*.label"]
                value_field: "areas.*.id"
                multiple: true
                hint: "Functions and subjects relevant to this gathering; not attendance eligibility or experience format. Select approved active values only; retain inactive values only for historical records."
              - label: Topics
                name: topics
                widget: relation
                required: false
                collection: taxonomy
                file: taxonomy
                search_fields: ["topics.*.label", "topics.*.id"]
                display_fields: ["topics.*.label"]
                value_field: "topics.*.id"
                multiple: true
                hint: "Subjects addressed by this gathering; not attendance eligibility or experience format. Select approved active values only; retain inactive values only for historical records."
              - { label: Starts At, name: startsAt, widget: string, required: false, hint: "Confirmed ISO 8601 timestamp with UTC offset. Leave blank until confirmed." }
              - { label: Ends At, name: endsAt, widget: string, required: false, hint: "Confirmed ISO 8601 timestamp with UTC offset. Leave blank until confirmed." }
              - { label: Time Zone, name: timeZone, widget: string, required: false, hint: "Confirmed IANA zone, for example Europe/London. Do not infer from venue." }
              - { label: Time, name: time, widget: string, required: false }
              - { label: Event History, name: historyLabel, widget: string, required: false }
              - { label: Capacity, name: capacity, widget: number, value_type: int, min: 1, required: false, hint: "Primary capacity. If both capacity fields are set, they must agree." }
              - { label: Editorial Capacity Number, name: capacity_number, widget: number, value_type: int, min: 1, required: false, hint: "Fallback when Capacity is blank. If both fields are set, they must agree." }
              - { label: Editorial Capacity Label, name: capacity_label, widget: select, options: [Attendees, Seats], required: false }
              - { label: Editorial Event Summary, name: card_summary, widget: text, required: false }
              - { label: Summary, name: summary, widget: text, required: false }
              - { label: Introduction, name: description, widget: text, required: false }
              - { label: Details, name: details, widget: text, required: false }
              - { label: Event Name, name: title, widget: string }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Venue, name: venue, widget: string, required: false }
              - label: Date
                name: date
                widget: date
                format: "YYYY-MM-DD"
                required: false
              - { label: Image Key (for mapping), name: imageKey, widget: string, required: false }
              - { label: Partner Event, name: partnerEvent, widget: boolean, required: false, default: false, hint: "Independent organiser; never uses the Media Collective invitation form." }
              - { label: Partner Event Copy, name: partnerEventCopy, widget: text, required: false }
              - { label: Departure, name: departure, widget: string, required: false }
              - { label: Destination, name: destination, widget: string, required: false }
              - { label: CTA Label, name: ctaLabel, widget: string, required: false }
              - { label: Subtitle, name: subtitle, widget: string, required: false }
              - label: Hero Highlights
                name: heroHighlights
                widget: list
                required: false
                hint: "Short factual audience, format and attendance labels. Replaces the plain hero tag row; taxonomy is unchanged."
                field: { label: Highlight, name: highlight, widget: string }
              - label: Status Label
                name: statusLabel
                widget: select
                required: false
                options: [Next Event, Upcoming Event, Featured Event, Registration Closed]
                hint: "Optional display label. Date/status still determine whether an event has finished."
              - { label: Attendance Statement, name: attendanceStatement, widget: text, required: false, hint: "Defaults to free attendance with limited, curated invitations." }
              - { label: Featured Image, name: image, widget: image, required: false, hint: "Upload artwork for this event. Existing image keys remain supported." }
              - { label: Who Attends, name: whoAttends, widget: text, required: false }
              - label: Why Attend
                name: whyAttend
                widget: list
                required: false
                field: { label: Outcome, name: outcome, widget: string }
              - label: What To Expect
                name: whatToExpect
                widget: list
                required: false
                field: { label: Experience, name: experience, widget: text }
              - label: Programme
                name: programme
                widget: list
                required: false
                fields:
                  - { label: Time, name: time, widget: string, required: false }
                  - { label: Description, name: description, widget: text }
              - label: Partners
                name: partners
                widget: list
                required: false
                hint: "Only organisations actively contributing to this event."
                fields:
                  - { label: Partner Name, name: name, widget: string }
                  - { label: Partner Logo, name: logo, widget: image, required: false }
                  - { label: External URL, name: url, widget: string, required: false }
              - { label: CTA Heading, name: ctaHeading, widget: string, required: false }
              - { label: CTA Copy, name: ctaCopy, widget: text, required: false }
              - { label: Registration Link, name: registrationLink, widget: string, required: false, hint: "Optional HTTP(S) or site URL. Leave blank to use the existing invitation form." }
              - { label: SEO Title, name: seoTitle, widget: string, required: false }
              - { label: SEO Description, name: seoDescription, widget: text, required: false }
              - { label: Social Image, name: socialImage, widget: image, required: false }

  - name: eventsPage
    label: Events Page Layout
    files:
      - name: eventsPage
        label: Events Page Layout
        file: "src/content/eventsPage.json"
        format: json
        fields:
          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}}"
            types:
              - label: Event Formats
                name: eventFormats
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: eventFormats
                  - label: ID
                    name: id
                    widget: string
                    required: false
                  - label: Hidden
                    name: hidden
                    widget: boolean
                    required: false
                    default: false
                  - label: Body
                    name: body
                    widget: text
                    required: false
                  - label: Section Label
                    name: eyebrow
                    widget: string
                    required: false
                  - label: Heading
                    name: heading
                    widget: string
                    required: false
                  - label: Format Events
                    name: items
                    widget: list
                    required: false
                    fields:
                      - label: Event
                        name: eventId
                        widget: relation
                        collection: events
                        file: eventsContent
                        search_fields:
                          - events.*.title
                          - events.*.id
                        display_fields:
                          - events.*.title
                        value_field: events.*.id
                      - label: Display Name
                        name: title
                        widget: string
                        required: false
              - label: Event Categories
                name: eventCategories
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: eventCategories
                  - label: ID
                    name: id
                    widget: string
                    required: false
                  - label: Hidden
                    name: hidden
                    widget: boolean
                    required: false
                    default: false
                  - label: Categories
                    name: groups
                    widget: list
                    required: false
                    fields:
                      - label: Category
                        name: label
                        widget: string
                      - label: Events
                        name: items
                        widget: list
                        fields:
                          - label: Event
                            name: eventId
                            widget: relation
                            collection: events
                            file: eventsContent
                            search_fields:
                              - events.*.title
                              - events.*.id
                            display_fields:
                              - events.*.title
                            value_field: events.*.id
                          - label: Display Name
                            name: title
                            widget: string
                            required: false
              - label: Intro Block
                name: eventsIntro
                widget: object
                fields:
                  - name: type
                    widget: hidden
                    default: eventsIntro
                  - label: ID
