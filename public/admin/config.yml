              - {
                  label: Hidden,
                  name: hidden,
                  widget: boolean,
                  required: false,
                  default: false,
                }
              - label: Variant
                name: variant
                widget: select
                required: false
                options:
                  - { label: Default, value: default }
                  - { label: Darker, value: darker }
                  - { label: Accent, value: accent }
              # Shared fields
              - { label: Title, name: title, widget: string, required: false }
              - {
                  label: Accent Word,
                  name: accentWord,
                  widget: string,
                  required: false,
