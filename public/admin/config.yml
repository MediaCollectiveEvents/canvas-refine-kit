local_backend: true

backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit
  branch: minviableproduct

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # === HOMEPAGE CONTENT (homepage.json) ===
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: "src/content/homepage.json"
        format: json
        fields:
          # HERO
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Description, name: description, widget: text }

              # Theme toggle
              - label: Hero Theme
                name: theme
                widget: select
                default: dark
                options:
                  - { label: "Dark", value: "dark" }
                  - { label: "Light", value: "light" }

              # Overlay strength control
              - label: Hero Overlay Strength
                name: overlayStrength
                widget: select
                default: 0.5
                options:
                  - { label: "0 (Off)", value: 0 }
                  - { label: "0.25 (Brightest)", value: 0.25 }
                  - { label: "0.5 (Bright &amp; Balanced)", value: 0.5 }
                  - { label: "0.75 (More Contrast)", value: 0.75 }
                  - { label: "1 (Max Contrast)", value: 1 }

              - label: Primary CTA
                name: primaryCta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }
              - label: Secondary CTA
                name: secondaryCta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }

          # SECTIONS
          - label: Sections
            name: sections
            widget: list
            types:
              # JOIN COMMUNITY
              - label: Join Community
                name: joinCommunity
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "joinCommunity",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }

                  # --- Title Styling ---
                  - label: Title Styling
                    name: styleTitle
                    widget: object
                    required: false
                    fields:
                      - {
                          label: Eyebrow (optional),
                          name: eyebrow,
                          widget: string,
                          required: false,
                        }
                      - {
                          label: Subline (optional),
                          name: sub,
                          widget: string,
                          required: false,
                        }
                      - label: Align
                        name: align
                        widget: select
                        required: false
                        default: center
                        options:
                          - { label: Center, value: center }
                          - { label: Left, value: left }
                          - { label: Right, value: right }
                      - label: Tone
                        name: tone
                        widget: select
                        required: false
                        default: default
                        options:
                          - { label: Default, value: default }
                          - { label: Muted, value: muted }
                      - {
                          label: Disable Italic Emphasis,
                          name: disableEmphasis,
                          widget: boolean,
                          required: false,
                          default: false,
                        }

                  # --- Section Surface ---
                  - label: Section Surface
                    name: styleWrapper
                    widget: object
                    required: false
                    fields:
                      - label: Variant
                        name: variant
                        widget: select
                        required: false
                        default: glow
                        options:
                          - { label: Clean, value: clean }
                          - { label: Tint, value: tint }
                          - { label: Glow, value: glow }
                      - label: Padding
                        name: padding
                        widget: select
                        required: false
                        default: lux
                        options:
                          - { label: Lux (spacious), value: lux }
                          - { label: Regular, value: regular }
                      - {
                          label: Micro noise texture,
                          name: noise,
                          widget: boolean,
                          required: false,
                          default: false,
                        }
                      - {
                          label: Micro grid overlay,
                          name: grid,
                          widget: boolean,
                          required: false,
                          default: false,
                        }
                      - {
                          label: Soft top/bottom fades,
                          name: withFades,
                          widget: boolean,
                          required: false,
                          default: true,
                        }

