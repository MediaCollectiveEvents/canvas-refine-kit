backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit # <--- change if repo name is different
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # HOMEPAGE CONTENT
  - name: "homepage"
    label: "Homepage"
    file: "src/content/homepage.json"
    format: "json"
    fields:
      - { name: "heroTitle", label: "Hero Title", widget: "string" }
      - { name: "heroSubtitle", label: "Hero Subtitle", widget: "text" }
      - {
          name: "heroButtonLabel",
          label: "Hero Button Label",
          widget: "string",
          required: false
        }
      - {
          name: "heroButtonUrl",
          label: "Hero Button URL",
          widget: "string",
          required: false
        }
      - name: "sections"
        label: "Homepage Sections"
        widget: "list"
        types:
          - label: "Home Intro"
            name: "homeIntro"
            widget: "object"
            fields:
              - { name: "type", label: "Type", widget: "hidden", default: "homeIntro" }
              - { name: "title", label: "Title", widget: "string" }
              - { name: "body", label: "Body", widget: "markdown" }

          - label: "Who Attends"
            name: "whoAttends"
            widget: "object"
            fields:
              - { name: "type", label: "Type", widget: "hidden", default: "whoAttends" }
              - { name: "title", label: "Title", widget: "string" }
              - label: "Items"
                name: "items"
                widget: "list"
                field: { name: "item", label: "Item", widget: "string" }

          - label: "Event Formats"
            name: "eventFormats"
            widget: "object"
            fields:
              - { name: "type", label: "Type", widget: "hidden", default: "eventFormats" }
              - { name: "title", label: "Title", widget: "string" }
              - label: "Formats"
                name: "formats"
                widget: "list"
                fields:
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "description", label: "Description", widget: "text" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "object"
            fields:
              - { name: "type", label: "Type", widget: "hidden", default: "testimonials" }
              - { name: "title", label: "Title", widget: "string" }
              - label: "Testimonials"
                name: "testimonials"
                widget: "list"
                fields:
                  - { name: "quote", label: "Quote", widget: "text" }
                  - { name: "author", label: "Author", widget: "string" }

  # ABOUT SECTION / PAGE
  - name: "about"
    label: "About"
    file: "src/content/about.json"
    format: "json"
    fields:
      - { name: "title", label: "Title", widget: "string" }
      - {
          name: "accent",
          label: "Accent Word",
          widget: "string",
          required: false
        }
      - { name: "intro", label: "Intro Text", widget: "markdown" }
      - {
          name: "body",
          label: "Body Text",
          widget: "markdown",
          required: false
        }

  # FAQ
  - name: "faq"
    label: "FAQs"
    file: "src/content/faq.json"
    format: "json"
    fields:
      - name: "items"
        label: "FAQ Items"
        widget: "list"
        fields:
          - { name: "question", label: "Question", widget: "string" }
          - { name: "answer", label: "Answer", widget: "markdown" }

  # GLOBAL SITE SETTINGS (palette, nav, footer)
  - name: "settings"
    label: "Site Settings"
    file: "src/content/settings.json"
    format: "json"
    fields:
      - name: "palette"
        label: "Colour Palette"
        widget: "object"
        fields:
          - {
              name: "primary",
              label: "Primary Colour",
              widget: "string",
              default: "#36e0c6"
            }
          - {
              name: "secondary",
              label: "Secondary Colour",
              widget: "string",
              required: false
            }
          - {
              name: "background",
              label: "Background Colour",
              widget: "string",
              required: false
            }
      - name: "footer"
        label: "Footer"
        widget: "object"
        fields:
          - {
              name: "text",
              label: "Footer Text",
              widget: "string",
              required: false
            }
          - {
              name: "showEventsInFooter",
              label: "Show Events in Footer",
              widget: "boolean",
              default: false
            }
      - name: "nav"
        label: "Navigation"
        widget: "list"
        fields:
          - { name: "label", label: "Label", widget: "string" }
          - { name: "href", label: "URL", widget: "string" }

  # SPONSORS DIRECTORY
  - name: "sponsors"
    label: "Sponsors"
    file: "src/content/sponsors.json"
    format: "json"
    fields:
      - name: "items"
        label: "Sponsors"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "url",
              label: "Website URL",
              widget: "string",
              required: false
            }
          - { name: "tier", label: "Tier", widget: "string", required: false }
          - { name: "logo", label: "Logo", widget: "image", required: false }
          - {
              name: "summary",
              label: "Summary",
              widget: "text",
              required: false
            }

  # SPEAKERS DIRECTORY
  - name: "speakers"
    label: "Speakers"
    file: "src/content/speakers.json"
    format: "json"
    fields:
      - name: "items"
        label: "Speakers"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "role",
              label: "Role / Title",
              widget: "string",
              required: false
            }
          - {
              name: "company",
              label: "Company",
              widget: "string",
              required: false
            }
          - {
              name: "url",
              label: "Profile URL",
              widget: "string",
              required: false
            }
          - { name: "photo", label: "Photo", widget: "image", required: false }
          - { name: "bio", label: "Bio", widget: "markdown", required: false }

  # PARTNERS
  - name: "partners"
    label: "Partners"
    file: "src/content/partners.json"
    format: "json"
    fields:
      - name: "items"
        label: "Partners"
        widget: "list"
        fields:
          - { name: "name", label: "Name", widget: "string" }
          - {
              name: "url",
              label: "Website URL",
              widget: "string",
              required: false
            }
          - { name: "logo", label: "Logo", widget: "image", required: false }
          - {
              name: "description",
              label: "Description",
              widget: "markdown",
              required: false
            }

  # BLOG POSTS (JSON)
  - name: "blog"
    label: "Blog Posts"
    file: "src/content/blog.json"
    format: "json"
    fields:
      - label: "Posts"
        name: "posts"
        widget: "list"
        fields:
          - { name: "slug", label: "Slug", widget: "string" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "date", label: "Date", widget: "datetime" }
          - { name: "excerpt", label: "Excerpt", widget: "text", required: false }
          - { name: "body", label: "Body", widget: "markdown" }
          - name: "keywordIds"
            label: "Keyword IDs"
            widget: "list"
            required: false
            field:
              { name: "keywordId", label: "Keyword ID", widget: "string" }

  # EVENTS (JSON via CMS)
  - name: "events-json"
    label: "Events"
    file: "src/content/events.json"
    format: "json"
    fields:
      - label: "Events"
        name: "events"
        widget: "list"
        fields:
          - { name: "id", label: "ID", widget: "number" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "location", label: "Location", widget: "string" }
          - { name: "venue", label: "Venue", widget: "string" }
          - { name: "imageKey", label: "Image Key", widget: "string" }
          - name: "keywordIds"
            label: "Keyword IDs"
            widget: "list"
            required: false
            field:
              { name: "keywordId", label: "Keyword ID", widget: "string" }

  # TOPICS (JSON) – for Topic Pages
  - name: "topics"
    label: "Topics"
    file: "src/content/topics.json"
    format: "json"
    fields:
      - label: "Topics"
        name: "topics"
        widget: "list"
        fields:
          - { name: "id", label: "ID", widget: "string", hint: "e.g. ai-automation" }
          - { name: "title", label: "Title", widget: "string" }
          - { name: "description", label: "Description", widget: "markdown" }
          - name: "keywordIds"
            label: "Keyword IDs"
            widget: "list"
            required: false
            field:
              { name: "keywordId", label: "Keyword ID", widget: "string" }
          - label: "Sections"
            name: "sections"
            widget: "list"
            types:
              - label: "Hero"
                name: "hero"
                widget: "object"
                fields:
                  - { name: "type", label: "Type", widget: "hidden", default: "hero" }
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "subtitle", label: "Subtitle", widget: "string", required: false }
              - label: "Text Block"
                name: "text"
                widget: "object"
                fields:
                  - { name: "type", label: "Type", widget: "hidden", default: "text" }
                  - { name: "title", label: "Title", widget: "string" }
                  - { name: "body", label: "Body", widget: "markdown" }
              - label: "Related Content"
                name: "relatedContent"
                widget: "object"
                fields:
                  - { name: "type", label: "Type", widget: "hidden", default: "relatedContent" }
                  - { name: "title", label: "Title", widget: "string" }
                  - name: "keywordIds"
                    label: "Keyword IDs"
                    widget: "list"
                    required: false
                    field:
                      { name: "keywordId", label: "Keyword ID", widget: "string" }
``