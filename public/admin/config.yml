  - name: blogPosts
    label: Blog Posts
    files:
      - name: blogPosts
        label: Blog Posts
        file: "src/content/blogPosts.json"
        format: json
        fields:
          - label: Posts
            name: posts
            widget: list
            allow_add: true
            collapsed: false
            summary: "{{fields.title}} ({{fields.slug}})"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Slug, name: slug, widget: string }
              - { label: Category, name: category, widget: string }
              - label: Areas
                name: areas
                widget: relation
                required: false
                collection: taxonomy
                file: taxonomy
                search_fields: ["areas.*.label", "areas.*.id"]
                display_fields: ["areas.*.label"]
                value_field: "areas.*.id"
                multiple: true
                hint: "Professional functions relevant to this article. Select approved active values only; retain inactive values only for historical records."
              - label: Topics
                name: topics
                widget: relation
                required: false
                collection: taxonomy
                file: taxonomy
                search_fields: ["topics.*.label", "topics.*.id"]
                display_fields: ["topics.*.label"]
                value_field: "topics.*.id"
                multiple: true
                hint: "Subjects substantively addressed by this article. Select approved active values only; retain inactive values only for historical records."

              - label: Primary Contributor
                name: writerId
                widget: relation
                required: false
                collection: contributors
                file: contributors
                search_fields: ["contributors.*.displayName", "contributors.*.id"]
                display_fields: ["contributors.*.displayName"]
                value_field: "contributors.*.id"
                multiple: false
                hint: "Select one contributor. Author and Organisation remain fallbacks when no contributor resolves."
              - { label: Author, name: author, widget: string, required: false }
              - { label: Organisation, name: organisation, widget: string, required: false }
              - label: Related Events
                name: relatedEventIds
                widget: event-relation
                required: false
                collection: events
                file: eventsContent
                search_fields: ["events.*.title"]
                display_fields: ["events.*.title", "events.*.date"]
                value_field: "events.*.id"
                multiple: true
                hint: "Select canonical Media Collective events by title and date. Numeric IDs are preserved."
              - label: Related Organisations
                name: relatedPartnerIds
                widget: organisation-relation
                required: false
                collection: sponsors
                file: sponsors
                search_fields: ["logos.*.name"]
                display_fields: ["logos.*.name"]
                value_field: "logos.*.id"
                multiple: true
                hint: "Only named organisations with unique stable IDs are eligible. Logo presence does not establish sponsorship."

              - { label: Excerpt, name: excerpt, widget: text }
              - { label: Date, name: date, widget: datetime }
              - { label: Thumbnail Image, name: image, widget: image, required: false }
              - { label: Hero Image Key (optional, for hero mapping), name: imageKey, widget: string, required: false }
              - { label: Body, name: body, widget: text, required: false, hint: "Separate paragraphs with a blank line. Plain text; Markdown is not interpreted." }

