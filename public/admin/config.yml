local_backend: true

backend:
  name: github
  repo: MediaCollectiveEvents/canvas-refine-kit
  branch: minviableproduct

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  # === HOMEPAGE CONTENT (homepage.json) ===
  - name: homepage
    label: Homepage
    files:
      - name: homepage
        label: Homepage Content
        file: "src/content/homepage.json"
        format: json
        fields:
          - label: Hero
            name: hero
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - {
                  label: Subtitle,
                  name: subtitle,
                  widget: string,
                  required: false,
                }
              - {
                  label: Description,
                  name: description,
                  widget: text,
                  required: false,
                }

              - label: Hero Image
                name: image
                widget: image
                required: false

              - label: Theme
                name: theme
                widget: select
                options:
                  - { label: Dark, value: dark }
                  - { label: Light, value: light }

              - label: Overlay Strength
                name: overlayStrength
                widget: number
                value_type: float
                min: 0
                max: 1
                step: 0.05
                default: 0.5

              - label: Mobile Background Crop
                name: mobileCrop
                widget: select
                default: cover
                options:
                  - { label: "Cover (default)", value: cover }
                  - { label: "Contain (show full image)", value: contain }

              - label: Image Position
                name: imagePosition
                widget: select
                default: center
                options:
                  - { label: "Top", value: top }
                  - { label: "Center", value: center }
                  - { label: "Bottom", value: bottom }

              - label: Image Vertical Offset (px)
                name: imageOffset
                widget: number
                default: 0

              - label: CTA
                name: cta
                widget: object
                required: false
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: url, widget: string }

          - label: Sections
            name: sections
            widget: list
            summary: "{{fields.type}} – {{fields.heading}}"
            types:
              - label: Join Community
                name: joinCommunity
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "joinCommunity",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: About Intro
                name: aboutIntro
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "aboutIntro",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - { label: Body, name: body, widget: text }
                  - {
                      label: Extended Text,
                      name: extended,
                      widget: text,
                      required: false,
                    }

              - label: Who Attends
                name: whoAttends
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "whoAttends",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - label: Statistics
                    name: statistics
                    widget: object
                    fields:
                      - { label: Companies, name: companies, widget: string }
                      - { label: Board Level, name: boardLevel, widget: string }
                      - { label: Founders, name: founders, widget: string }
                  - label: Highlights
                    name: highlights
                    widget: list
                    allow_add: true
                    fields:
                      - { label: Title, name: title, widget: string }
                      - { label: Subtitle, name: subtitle, widget: string }
                      - { label: Icon Key, name: icon, widget: string }

              - label: Upcoming Events Intro
                name: upcomingEventsIntro
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "upcomingEventsIntro",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - {
                      label: Description,
                      name: description,
                      widget: text,
                      required: false,
                    }
                  - { label: Note, name: note, widget: string, required: false }
                  - {
                      label: Under-Header Text,
                      name: underHeader,
                      widget: text,
                      required: false,
                    }
                  - label: Primary CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }
                  - label: Secondary CTA
                    name: secondaryCta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }
                  - label: Card Image Aspect
                    name: imageAspect
                    widget: select
                    required: false
                    default: "3:2"
                    options:
                      - { label: "3:2", value: "3:2" }
                      - { label: "16:9", value: "16:9" }
                      - { label: "1:1", value: "1:1" }
                  - label: Card Image Fit
                    name: imageFit
                    widget: select
                    required: false
                    default: "contain"
                    options:
                      - { label: Contain (no crop), value: contain }
                      - { label: Cover (crop to fill), value: cover }
                  - {
                      label: Card Image Padding,
                      name: imagePadding,
                      widget: boolean,
                      required: false,
                      default: true,
                    }

              - label: For Brands & Partners
                name: forBrands
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "forBrands",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: New Here
                name: newHere
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "newHere",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - { label: Body, name: body, widget: text }
                  - label: CTA
                    name: cta
                    widget: object
                    required: false
                    fields:
                      - { label: Label, name: label, widget: string }
                      - { label: URL, name: url, widget: string }

              - label: Testimonials
                name: testimonials
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "testimonials",
                    }
                  - {
                      label: Heading,
                      name: heading,
                      widget: string,
                      required: false,
                    }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - label: Items
                    name: items
                    widget: list
                    field: { label: Testimonial, name: item, widget: text }

              - label: Partners Strip
                name: partners
                widget: object
                fields:
                  - {
                      label: Type,
                      name: type,
                      widget: hidden,
                      default: "partners",
                    }
                  - { label: Heading, name: heading, widget: string }
                  - {
                      label: Hidden,
                      name: hidden,
                      widget: boolean,
                      required: false,
                      default: false,
                    }
                  - {
                      label: Description,
                      name: description,
                      widget: text,
                      required: false,
                    }
                  - label: Logos
                    name: logos
                    widget: list
                    field: { label: Logo Name, name: logo, widget: string }

