
name: IONOS Deploy Now

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Upload artifacts
        uses: ionos-deploy-now/actions-upload@v3
        with:
          artifact-name: build
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: ionos-deploy-now/actions-download@v3
        with:
          artifact-name: build

      - name: Deploy to IONOS
        id: deploy
        uses: ionos-deploy-now/actions-deploy@v3
        with:
          token: ${{ secrets.IONOS_TOKEN }}
