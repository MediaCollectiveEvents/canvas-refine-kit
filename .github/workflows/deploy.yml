name: Deploy site to IONOS via SFTP

on:
  push:
    branches: ["main"] # deploys on every push to main
  workflow_dispatch: # allows manual runs from the Actions tab

env:
  NODE_VERSION: "20"
  BUILD_DIR: dist
  # This is resolved at runtime from your GitHub Secrets
  REMOTE_DIR: ${{ secrets.SFTP_TARGET_DIR }}

jobs:
  build:
    name: Build Vite site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build
        # Vite’s static deployment consists of uploading the 'dist/' folder.

      # Ensure .htaccess ships with the build (if you keep it outside /public)
      - name: Copy .htaccess into dist (optional)
        run: |
          if [ -f ".htaccess" ] && [ ! -f "dist/.htaccess" ]; then
            cp .htaccess dist/.htaccess
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy via SFTP
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}

      # Optional: pre-clean old hashed bundles in remote /assets for cache sanity.
      # Requires SSH access. If you don't have SSH, rely on the SFTP 'delete: true' below.
      - name: Pre-clean remote assets/ (optional)
        if: ${{ secrets.SSH_HOST && secrets.SSH_USER && secrets.SSH_KEY }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            set -e
            mkdir -p "${{ env.REMOTE_DIR }}"
            rm -rf "${{ env.REMOTE_DIR }}/assets"

      # Main deploy step: sync dist/ to your IONOS webspace folder via SFTP
      - name: SFTP deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          # Or use a key instead of password:
          # ssh_private_key: ${{ secrets.SFTP_PRIVATE_KEY }}
          local_path: ${{ env.BUILD_DIR }}/*
          remote_path: ${{ env.REMOTE_DIR }}
          # Remove remote files that are no longer present locally
          delete: true
          # Keep the deployment clean; ignore irrelevant files
          exclude: >
            **/.git*
            **/node_modules/**
