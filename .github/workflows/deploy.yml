name: Deploy site to IONOS via SFTP

on:
  push:
    branches: ["main"] # Deploy automatically when main is updated
  workflow_dispatch: # Allow manual deploys from GitHub UI

# Keep delivery steps from separate releases from interleaving.
concurrency:
  group: ionos-public-site
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUILD_DIR: dist
  DEPLOY_TARGET: production

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build Vite site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Validate deployment payload
        run: node scripts/check-deploy-payload.mjs

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: |
            ${{ env.BUILD_DIR }}/
            !${{ env.BUILD_DIR }}/.vite/
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    name: Deploy to IONOS over SFTP
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release validation scripts
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}

      - name: Validate downloaded deployment payload
        run: node scripts/check-deploy-payload.mjs

      - name: Deploy payload via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          # Upload the *contents* of dist:
          local_path: ${{ env.BUILD_DIR }}/*
          # Deploy into the current directory on the SFTP server:
          remote_path: .
          sftp_only: true

      # The existing action uses put -r without deletion. Clean only obsolete
      # files in our generated directory after targets exist, before activation.
      - name: Verify remote shells and remove obsolete generated HTML
        env:
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          if ! command -v sshpass >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          python3 scripts/clean-stale-seo-shells.py

      - name: Activate Apache routing last
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: ${{ env.BUILD_DIR }}/.htaccess
          remote_path: .
          sftp_only: true
