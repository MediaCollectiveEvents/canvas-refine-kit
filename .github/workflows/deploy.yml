name: Deploy site to IONOS via SFTP

on:
  push:
    branches: ["main"] # Deploy automatically when main is updated
  workflow_dispatch: # Allow manual deploys from GitHub UI

env:
  NODE_VERSION: "20"
  BUILD_DIR: dist

jobs:
  build:
    name: Build Vite site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Vite site
        run: npm run build

      - name: Ensure .htaccess is included in dist
        run: |
          if [ -f ".htaccess" ] && [ ! -f "dist/.htaccess" ]; then
            cp .htaccess dist/.htaccess
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy to IONOS over SFTP
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          # Upload the *contents* of dist:
          local_path: ${{ env.BUILD_DIR }}/*
          # Deploy into the current directory on the SFTP server:
          remote_path: .
          sftp_only: true
