name: Publish owner registration deletion
on:
  push:
    branches: [codex/portal-offline-20261118]
    paths: [.github/workflows/portal-offline.yml]
permissions:
  contents: read
concurrency:
  group: ionos-public-site
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'MediaCollectiveEvents/canvas-refine-kit' && github.ref == 'refs/heads/codex/portal-offline-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack exact prepared release
        shell: python
        run: |
          import base64,hashlib,pathlib,zipfile,io
          data=base64.b64decode(pathlib.Path('portal-release/registration-delete.zip.b64').read_text(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='9fc4199ebdabc7f2e421bc3193663d1c4c7a025c5f3a11c2c329800e18707f97'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            assert len(z.namelist())==24
            for name in z.namelist():
              p=pathlib.PurePosixPath(name)
              assert p.parts[0]=='partner-portal' and '..' not in p.parts
              assert p.suffix in ['.js','.css','.png','.html','.webmanifest']
              target=pathlib.Path('payload')/p
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(name));target.chmod(0o644)
          pathlib.Path('activation').mkdir()
          pathlib.Path('payload/partner-portal/index.html').replace('activation/index.html')
          owner=pathlib.Path('payload/partner-portal/owner/index.html')
          owner.parent.mkdir(parents=True,exist_ok=True)
          owner.write_bytes(pathlib.Path('activation/index.html').read_bytes());owner.chmod(0o644)
      - name: Upload portal assets only
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: payload/partner-portal/*
          remote_path: ./partner-portal/
          sftp_only: true
      - name: Activate portal index last
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: activation/index.html
          remote_path: ./partner-portal/
          sftp_only: true
      - name: Verify every published file over HTTPS
        shell: python
        run: |
          import base64,pathlib,zipfile,io,urllib.request,time
          data=base64.b64decode(pathlib.Path('portal-release/registration-delete.zip.b64').read_text(),validate=True)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
            for name in z.namelist():
              url='https://www.mediacollective.events/'+name+'?release='+str(time.time_ns())
              assert urllib.request.urlopen(url,timeout=30).read()==z.read(name),name
          assert urllib.request.urlopen('https://www.mediacollective.events/partner-portal/owner/',timeout=30).read()==pathlib.Path('activation/index.html').read_bytes()
          print('All 24 portal files and owner route verified. Main website routing unchanged.')
