name: Publish Event Hub attendance
on:
  push:
    branches: [codex/portal-offline-20261118]
    paths: [.github/workflows/portal-offline.yml]
permissions:
  contents: read
concurrency:
  group: ionos-public-site
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'MediaCollectiveEvents/canvas-refine-kit' && github.ref == 'refs/heads/codex/portal-offline-20261118'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate and unpack Event Hub release
        shell: python
        run: |
          import hashlib, pathlib, zipfile
          archive = pathlib.Path('portal-release/event-hub-attendance.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '2386d3c223debc30eaf5af044c7c6e62b081e38e58788d0510aa80cc2a920462'
          with zipfile.ZipFile(archive) as release:
            for item in release.namelist():
              path = pathlib.PurePosixPath(item)
              assert item == 'index.html' or (len(path.parts) == 2 and path.parts[0] == 'assets' and path.suffix in {'.js', '.css', '.png', '.jpg', '.jpeg', '.svg', '.webp'})
              destination = (pathlib.Path('activation') if item == 'index.html' else pathlib.Path('payload')) / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(release.read(item))
              destination.chmod(0o644)
      - name: Upload Event Hub assets
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: payload/assets/*
          remote_path: ./eventhub/assets/
          sftp_only: true
      - name: Verify assets before activating
        shell: python
        run: |
          import concurrent.futures, pathlib, time, urllib.parse, urllib.request
          def verify(asset):
            url = f'https://www.mediacollective.events/eventhub/assets/{urllib.parse.quote(asset.name)}?release={time.time_ns()}'
            with urllib.request.urlopen(url, timeout=30) as response:
              assert response.read() == asset.read_bytes(), asset.name
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            list(pool.map(verify, pathlib.Path('payload/assets').iterdir()))
      - name: Activate Event Hub index
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: access-5017155687.webspace-host.com
          port: 22
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: activation/index.html
          remote_path: ./eventhub/
          sftp_only: true
      - name: Verify the live Event Hub entry point
        shell: python
        run: |
          import pathlib, time, urllib.request
          url = f'https://www.mediacollective.events/eventhub/?release={time.time_ns()}'
          with urllib.request.urlopen(url, timeout=30) as response:
            assert response.read() == pathlib.Path('activation/index.html').read_bytes()
