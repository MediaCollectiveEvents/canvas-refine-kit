name: Fix public Event Hub navigation
on:
  push:
    branches: [codex/portal-offline-20261118]
    paths: [.github/workflows/event-hub-navigation.yml, 'portal-release/event-hub-navigation/**']
permissions:
  contents: read
concurrency:
  group: ionos-public-site
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate the homepage entry used by Apache
        env:
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
          IONOS_USER: ${{ secrets.SFTP_USERNAME }}
        run: |
          sudo apt-get install -y -qq sshpass
          printf '%s\n' 'pwd' 'ls -a' '-get .htaccess /tmp/public-home-routing' '-get index.html /tmp/public-home-entry' 'bye' | sshpass -e sftp -o StrictHostKeyChecking=accept-new -o BatchMode=no "$IONOS_USER@access-5017155687.webspace-host.com" 2>/dev/null | tr ' ' '\n' | grep -Ei '(^|/)([^/]*\.(html?|php|gz|br)|\.htaccess)$' || true
          if [ -f /tmp/public-home-routing ]; then
            awk 'tolower($0) ~ /^[[:space:]]*(directoryindex|rewriterule|rewritecond|redirect(match)?|fallbackresource)[[:space:]]/' /tmp/public-home-routing
          fi
          if [ -f /tmp/public-home-entry ]; then
            sha256sum /tmp/public-home-entry portal-release/event-hub-navigation/index.html
          fi
